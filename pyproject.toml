[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fabrix-ai"
version = "1.4.6"
description = "Graph-based agent framework powered by oauth-codex"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Fabrix" }
]
dependencies = [
  "oauth-codex>=2.3.0",
  "pydantic>=2.8",
]
keywords = ["agent", "llm", "graph", "tools", "oauth-codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/smturtle2/fabrix"
Repository = "https://github.com/smturtle2/fabrix"
Issues = "https://github.com/smturtle2/fabrix/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fabrix"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
